[project]
name = "anti-rrsi"
version = "1.0.0"
description = "Anti-RRSI: Inverse Regularized Recursive Self-Improvement for Agent Harness Verification, Null-Space Compression, and Adversarial Auditing"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Antigravity Research & Autonomous Engineering Org" }
]
dependencies = [
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
anti-rrsi = "anti_rrsi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anti_rrsi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"
